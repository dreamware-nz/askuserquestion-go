name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Verify build & tests
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Pick changelog excerpt for this tag if present, else autogenerate.
          if [ -f CHANGELOG.md ] && grep -q "^## ${tag}" CHANGELOG.md; then
            awk -v tag="## ${tag}" '
              $0 == tag { capture=1; next }
              capture && /^## v/ { exit }
              capture { print }
            ' CHANGELOG.md > /tmp/notes.md
            gh release create "$tag" \
              --title "$tag" \
              --notes-file /tmp/notes.md
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes
          fi
